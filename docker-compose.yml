services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pretriagem-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/zz-cardioprenatal.ini:/usr/local/etc/php/conf.d/zz-cardioprenatal.ini:ro
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_started
    networks:
      - pretriagem

  nginx:
    image: nginx:1.27-alpine
    container_name: pretriagem-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pretriagem

  mysql:
    image: mysql:8.4
    container_name: pretriagem-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cardioprenatal}
      MYSQL_USER: ${DB_USERNAME:-pretriagem}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - pretriagem_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pretriagem

  # Microsserviço ML (FastAPI) — sem acesso ao MySQL
  # Se a AnalisePython já estiver em :8010 no host, comente `ports` ou o serviço
  # e aponte PYTHON_API_URL=http://host.docker.internal:8010 no .env
  ml:
    build:
      context: ./python_api
      dockerfile: Dockerfile
    container_name: pretriagem-ml
    restart: unless-stopped
    # Porta 8010 fica com a API canônica (AnalisePython), que expõe /gestantes.
    # O Laravel usa PYTHON_API_URL=http://host.docker.internal:8010.
    # ports:
    #   - "8010:8010"
    environment:
      MODEL_PATH: models/model.pkl
      METRICS_PATH: data/metricas_modelos.csv
      MODEL_META_PATH: models/model_meta.json
      APP_NAME: CardioPrenatal-ML
      APP_VERSION: "1.0.0"
      LOG_LEVEL: info
    volumes:
      # model.pkl (CatBoost experimento_3_completo) + model_meta.json
      - ./python_api/models:/app/models:ro
      - ../AnalisePython/data:/app/data:ro
    networks:
      - pretriagem

  # Fila: ExecutarAnaliseGestante e demais jobs
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pretriagem-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-time=3600
    volumes:
      - ./:/var/www/html
      - ./docker/php/zz-cardioprenatal.ini:/usr/local/etc/php/conf.d/zz-cardioprenatal.ini:ro
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - pretriagem

  # Agenda: dataset:sync-from-api + analises:reprocess (routes/console.php)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pretriagem-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
      - ./docker/php/zz-cardioprenatal.ini:/usr/local/etc/php/conf.d/zz-cardioprenatal.ini:ro
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
      queue:
        condition: service_started
    networks:
      - pretriagem

networks:
  pretriagem:
    driver: bridge

volumes:
  pretriagem_mysql_data:
